name: n8n T1 Evidence Capture

on:
  workflow_dispatch:
  push:
    branches:
      - automation-evidence
    paths:
      - '.github/workflows/n8n-evidence.yml'
      - 'e2e/**'
      - 'playwright.config.js'
      - 'package.json'
      - 'run-and-serve.js'
      - 'workflow/T1_WhatsApp_Lead_AI_Scoring_Slack.json'

permissions:
  contents: read

jobs:
  capture-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install system dependency for bcrypt hashing
        run: sudo apt-get update && sudo apt-get install -y apache2-utils

      - name: Install dependencies
        run: npm install

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start disposable n8n and capture T1 evidence
        env:
          CI_MODE: '1'
        run: npm start

      - name: Upload screenshots, trace, report and video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t1-n8n-evidence-${{ github.run_number }}
          path: evidence/
          if-no-files-found: warn
          retention-days: 7
